name: Githb actions continue
on: workflow_dispatch
jobs:
  setcache:
    runs-on: ubuntu-latest
    name: Set dependencies cache
    steps:
      - name: show step 1 job 1 output
        run: echo "step 1 job 1 output"
  getcache:
    needs: setcache
    runs-on: ubuntu-latest
    name: Get dependencies cache
    steps:
      - run: exit 1
      - name: show step 1 job 1 output
        if: always()
        run: echo "step 1 job 1 output"
  reports:
    needs: [setcache,getcache]
    runs-on: ubuntu-latest
    name: Reports
    steps:
      - run: echo "reports"
    
