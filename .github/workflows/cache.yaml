name: Githb actions cache
on: workflow_dispatch
jobs:
  setcache:
    runs-on: ubuntu-latest
    name: Set dependencies cache
    steps:
      - run: exit 1
      - uses: actions/checkout@v6
      - name: setup go env
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/cache@v6
        id: cache-dependencies
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-goversion1274-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: download dependencies verbose        
        run: go mod download -x
  getcache:
    needs: setcache
    runs-on: ubuntu-latest
    name: Get dependencies cache
    steps:
      - uses: actions/checkout@v6
      - name: setup go env
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-goversion1274-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: download dependencies verbose
        run: go mod download -x
  reports:
    needs: [getcache,setcache]
    runs-on: ubuntu-latest
    name: Show always reports    
    steps:
      - run: echo "reports"
        if: always()
