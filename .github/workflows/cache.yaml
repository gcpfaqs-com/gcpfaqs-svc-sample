name: Cache Modules
on: workflow_dispatch

jobs:
  createmodules:
    runs-on: ubuntu-latest
    name: create dependencies
    steps:
      - name: get code
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum

      - name: go modules tidy
        run: go mod tidy
