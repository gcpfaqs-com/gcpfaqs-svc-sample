name: Using cache
on: workflow_dispatch
jobs:
  setcache:
    runs-on: ubuntu-latest
    name: Set cache
    steps:
      - uses: actions/checkout@v6
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: download dependencies
        run: go mod download
  getcache:
    runs-on: ubuntu-latest
    name: Get cache
    steps:
      - uses: actions/checkout@v6
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: download dependencies
        run: go mod download        
