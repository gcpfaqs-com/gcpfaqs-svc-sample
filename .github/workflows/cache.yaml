name: Cache Modules
on: workflow_dispatch
jobs:
  createmodules:
    runs-on: ubuntu-latest
    name: create dependencies
    steps:
      - name: get code
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          go-version-file: 'go.mod'
          check-latest: false
      - name: go modules tidy
        run: go mod tidy
    
