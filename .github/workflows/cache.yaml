name: Usando cache en githb actions
on: workflow_dispatch
jobs:
  setcache:
    runs-on: ubuntu-latest
    name: Set dependencies cache
    steps:
      - uses: actions/checkout@v6
      - name: setup go env
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: download dependencies verbose
        run: go mod download -x

  getcache:
    needs: setcache
    runs-on: ubuntu-latest
    name: Get dependencies cache
    steps:
      - uses: actions/checkout@v6
      - name: setup go env
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: download dependencies verbose
        run: go mod download -x
                    
