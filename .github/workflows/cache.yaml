name: Testing Cache
on: workflow_dispatch
jobs:
  setcache:
    runs-on: ubuntu-latest
    name: Set cache
    steps:
    - uses: actions/checkout@v7
    - name: Cache modules
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: set go env
      uses: actions/setup-go@v7
      with:    
        go-version: '1.27.4'
        cache: true
    - name: download modules
      run: go mod download
  getcache:
    needs: setcache
    runs-on: ubuntu-latest
    name: Get cache
    steps:
    - uses: actions/checkout@v7
    - name: Cache modules
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: set go env
      uses: actions/setup-go@v7
      with:    
        go-version: '1.27.4'
        cache: true        
    - name: download modules
      run: go mod download
        
