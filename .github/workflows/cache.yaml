name: Cache Modules
on: workflow_dispatch

jobs:
  createmodules:
    runs-on: ubuntu-latest
    name: create dependencies
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: cache modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: false
          cache: false
          cache-dependency-path: |
            go.sum
      - run: go mod tidy
      - run: echo "job 1 completed"

  testing:
    needs: createmodules
    runs-on: ubuntu-latest
    name: test go files
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: cache modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          check-latest: false
          cache: false
          cache-dependency-path: |
            go.sum
      - run: echo "job 2 completed"
