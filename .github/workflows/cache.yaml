name: Use cache to store depemdencies
on: workflow_dispatch
jobs:
  setcache:
    name: set cache job
    runs-on: ubuntu-latest
    steps:
      - run: actions/checkout@v6
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: download dependecies
        run: go mod download

  getcache:
    name: get cache job
    runs-on: ubuntu-latest
    steps:
      - run: actions/checkout@v6
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: download dependecies
        run: go mod download

        
