name: matrix usage
on: workflow_dispatch
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        versions: [14,15,16]
        include:
          - os: ubuntu-latest
            version: 17
        exclude:
          - os: windows-latest
            versions: 14
    runs-on: ${{ matrix.os }}
    name: compile test build
    steps:
      - name: show values
        run: |
          echo "current os ${{ matrix.os }}"
          echo "current node version ${{ matrix.versions }}"
