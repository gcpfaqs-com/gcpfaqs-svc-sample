name: matrix example
on: workflow_dispatch
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        versions: [14,15,16]
        include:
          - os: ubuntu-latest
            versions: 17
        exclude:
          - os: windows-latest
            versions: 14
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          echo "current os ${{ matrix.os }}"
          echo "current versions ${{ matrix.versions }}"
      - name: exit on 14
        if: matrix.versions == 14
        run: exit 1
