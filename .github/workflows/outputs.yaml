name: Outputs
on: workflow_dispatch
jobs:
  setoutput:
    runs-on: ubuntu-latest
    name: Set Output
    outputs:
      version: ${{ steps.set_output.outputs.app_version }}
      build: ${{ steps.set_output.outputs.app_build }}
    steps:
      - name: set app_version value
        id: set_output
        run: |
          echo "app_version=123" >> "$GITHUB_OUTPUT"
          echo "app_build=4562"  >> "$GITHUB_OUTPUT"
  getoutputs:
    runs-on: ubuntu-latest
    name: Get Output
    needs: setoutput
    steps:
      - name: Show output values
        run:
          echo "app build ${{ needs.setoutput.outputs.build }}"
          echo "app version ${{ needs.setoutput.outputs.version }}"
