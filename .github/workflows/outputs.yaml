name: Testing Outputs
on: workflow_dispatch
jobs:
  setoutput:
    runs-on: ubuntu-latest
    name: Set Output
    outputs:
      version: ${{ steps.set_output.outputs.app_version }}
      build: ${{ steps.set_output.outputs.app_build }}
    steps:
      - name: set version and build
        id: set_output
        run: |
          echo "app_version=123" >> $GITHUB_OUTPUT        
          echo "app_build=456" >> $GITHUB_OUTPUT        
  getoutput:
    needs: setoutput
    runs-on: ubuntu-latest
    name: Get Outputs
    steps:
      - name: print version and build
        run: |
          echo "app version ${{ needs.setoutput.outputs.version }}"
          echo "app build ${{ needs.setoutput.outputs.build }}"
